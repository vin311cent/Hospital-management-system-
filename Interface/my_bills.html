<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bills | Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">🏥 MediCare HMS</div>
            <nav class="nav-links">
                <a class="nav-item" href="dashboard.html">Dashboard</a>
                <a class="nav-item" href="appointments.html">My Appointments</a>
                <a class="nav-item" href="my_records.html">My Health Record</a>
                <a class="nav-item active" href="my_bills.html">My Bills</a>
            </nav>
            <a href="login.html" class="logout-link">Log out</a>
        </aside>

        <main class="content">
            <h2 class="page-title">My Bills</h2>

            <div class="card section">
                <div class="stat-label">Outstanding Balance</div>
                <div class="stat-number" style="color: var(--danger);">K 450.00</div>
            </div>

            <div class="card section">
                <div class="flex-between">
                    <strong>Bill #204 — 2026-09-30</strong>
                    <span class="badge badge-unpaid">Unpaid</span>
                </div>
                <table style="margin-top:10px">
                    <tbody>
                        <tr>
                            <td>Consultation Fee</td>
                            <td style="text-align:right">K 200.00</td>
                        </tr>
                        <tr>
                            <td>Lab Test: Full Blood Count</td>
                            <td style="text-align:right">K 250.00</td>
                        </tr>
                        <tr>
                            <td><strong>Total</strong></td>
                            <td style="text-align:right"><strong>K 450.00</strong></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="card section">
                <div class="flex-between">
                    <strong>Bill #180 — 2026-08-15</strong>
                    <span class="badge badge-ok">Paid</span>
                </div>
                <table style="margin-top:10px">
                    <tbody>
                        <tr>
                            <td>Routine Checkup</td>
                            <td style="text-align:right">K 150.00</td>
                        </tr>
                        <tr>
                            <td><strong>Total</strong></td>
                            <td style="text-align:right"><strong>K 150.00</strong></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
